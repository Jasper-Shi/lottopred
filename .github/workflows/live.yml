name: lotto649-live-cycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: lotto649-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read Stage-1 execution guards
        id: execution_guard
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          disabled_sha256 = "ad3237bc57c85013e85dad16d1b6f04f43b50991d666a4b1528bf5b8614a76b6"
          stage1_sha256 = "d53a9a9eed5ab434b021472135d6aed65c2c052339e0dfb88f8c00d46c0d8931"
          not_before = datetime(2026, 8, 27, 15, 15, tzinfo=UTC)
          values = {
              "refresh": False,
              "live": False,
              "cycle": False,
          }

          def write_outputs():
              with open(
                  os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
              ) as output:
                  for name, enabled in values.items():
                      output.write(f"{name}={'true' if enabled else 'false'}\n")

          write_outputs()
          try:
              observed_sha256 = hashlib.sha256(
                  Path("config.yaml").read_bytes()
              ).hexdigest()
          except OSError:
              print(
                  "::warning::config.yaml is unavailable; "
                  "execution remains sealed"
              )
          else:
              if observed_sha256 == disabled_sha256:
                  print("Verified incident-disabled config; execution remains sealed")
              elif observed_sha256 != stage1_sha256:
                  print(
                      "::warning::Unapproved config SHA-256; "
                      "execution remains sealed"
                  )
              else:
                  expected_context = {
                      "GITHUB_REPOSITORY": "Jasper-Shi/lottopred",
                      "GITHUB_EVENT_NAME": "workflow_dispatch",
                      "GITHUB_REF": "refs/heads/main",
                  }
                  mismatches = [
                      name
                      for name, expected in expected_context.items()
                      if os.environ.get(name) != expected
                  ]
                  if mismatches:
                      print(
                          "::warning::Stage-1 workflow context is not authorized; "
                          "execution remains sealed"
                      )
                  else:
                      try:
                          completed = subprocess.run(
                              ["git", "rev-parse", "--verify", "HEAD^{commit}"],
                              check=False,
                              capture_output=True,
                              text=True,
                          )
                      except (OSError, subprocess.SubprocessError, ValueError):
                          print(
                              "::warning::Checkout HEAD is unavailable; "
                              "execution remains sealed"
                          )
                      else:
                          checkout_head = completed.stdout.strip()
                          if (
                              completed.returncode != 0
                              or completed.stderr
                              or os.environ.get("GITHUB_SHA") != checkout_head
                          ):
                              print(
                                  "::warning::Workflow SHA differs from checkout HEAD; "
                                  "execution remains sealed"
                              )
                          elif datetime.now(UTC) < not_before:
                              print(
                                  "::warning::Stage-1 source publication window is not open; "
                                  "execution remains sealed"
                              )
                          else:
                              values.update(
                                  refresh=True,
                                  live=True,
                                  cycle=True,
                              )
                              write_outputs()
                              print("Authorized exact Stage-1 production canary")
          PY
      - uses: actions/setup-python@v5
        if: steps.execution_guard.outputs.cycle == 'true'
        with:
          python-version: '3.12'
      - if: steps.execution_guard.outputs.cycle == 'true'
        run: python -m pip install --upgrade pip
      - if: steps.execution_guard.outputs.cycle == 'true'
        run: pip install -e .
      - name: Run protected production live canary
        if: steps.execution_guard.outputs.cycle == 'true'
        env:
          LOTTO_GITHUB_PUBLICATION_TOKEN: ${{ secrets.LOTTO_GITHUB_PUBLICATION_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os

          publication_token = os.environ.pop("LOTTO_GITHUB_PUBLICATION_TOKEN")

          from lotto649.live_orchestration import orchestrate_github_live_cycle

          orchestrate_github_live_cycle(token=publication_token)
          PY
