name: v2-v4-blind-research

on:
  workflow_dispatch:
  push:
    branches: [feature/v2-v4-research]
    paths:
      - 'research-trigger.txt'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Build validated historical dataset
        run: lotto649 bootstrap
      - name: Run 2020-2025 frozen blind benchmark
        run: lotto649 backtest
      - uses: actions/upload-artifact@v4
        with:
          name: v2-v4-research-reports
          path: reports/
          if-no-files-found: error
