name: lotto649-backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config.yaml'
      - 'pyproject.toml'
      - '.github/workflows/backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read Stage-1 execution guards
        id: execution_guard
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          disabled_sha256 = "ad3237bc57c85013e85dad16d1b6f04f43b50991d666a4b1528bf5b8614a76b6"
          stage1_sha256 = "d53a9a9eed5ab434b021472135d6aed65c2c052339e0dfb88f8c00d46c0d8931"
          values = {
              "refresh": False,
              "backtest": False,
          }
          with open(
              os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
          ) as output:
              for name, enabled in values.items():
                  output.write(
                      f"{name}={'true' if enabled else 'false'}\n"
                  )
          try:
              observed_sha256 = hashlib.sha256(
                  Path("config.yaml").read_bytes()
              ).hexdigest()
          except OSError:
              print(
                  "::warning::config.yaml is unavailable; "
                  "execution remains sealed"
              )
          else:
              if observed_sha256 == disabled_sha256:
                  print("Verified incident-disabled config; execution remains sealed")
              elif observed_sha256 == stage1_sha256:
                  print(
                      "Verified Stage-1 live config; this workflow remains sealed"
                  )
              else:
                  print(
                      "::warning::Unapproved config SHA-256; "
                      "execution remains sealed"
                  )
          PY
      - uses: actions/setup-python@v5
        if: >-
          steps.execution_guard.outputs.refresh == 'true' ||
          steps.execution_guard.outputs.backtest == 'true'
        with:
          python-version: '3.12'
      - if: >-
          steps.execution_guard.outputs.refresh == 'true' ||
          steps.execution_guard.outputs.backtest == 'true'
        run: python -m pip install --upgrade pip
      - if: >-
          steps.execution_guard.outputs.refresh == 'true' ||
          steps.execution_guard.outputs.backtest == 'true'
        run: pip install -e .
      - name: Append and validate verified history
        if: steps.execution_guard.outputs.refresh == 'true'
        run: lotto649 bootstrap
      - name: Run verified-history walk-forward diagnostic
        if: steps.execution_guard.outputs.backtest == 'true'
        run: lotto649 backtest
      - uses: actions/upload-artifact@v4
        if: steps.execution_guard.outputs.backtest == 'true'
        with:
          name: backtest-reports
          path: reports/
          if-no-files-found: error
