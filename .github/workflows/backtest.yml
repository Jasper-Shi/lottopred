name: lotto649-backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config.yaml'
      - 'pyproject.toml'
      - '.github/workflows/backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Build and validate historical data
        run: lotto649 bootstrap
      - name: Run frozen blind walk-forward benchmark
        run: lotto649 backtest
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: reports/
          if-no-files-found: error
