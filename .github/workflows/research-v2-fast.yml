name: v2-fast-legacy-diagnostic

on:
  workflow_dispatch:
  push:
    branches: [feature/v2-v4-research]
    paths:
      - 'v2-trigger.txt'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The backtest boundary verifies registered ancestor objects.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Verify frozen historical dataset exists
        run: test -s data/processed/draws.csv
      - name: Run isolated V2 legacy diagnostic
        run: lotto649 --config config/research-v2.yaml backtest
      - uses: actions/upload-artifact@v4
        with:
          name: v2-fast-reports
          path: reports/
          if-no-files-found: error
