name: integration-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/processed/epochs/**'
      - 'evidence/data_integrity/**'
      - 'evidence/live_sources/**'
      - 'src/lotto649/backtest.py'
      - 'src/lotto649/data.py'
      - 'src/lotto649/data_integrity.py'
      - 'src/lotto649/live.py'
      - 'src/lotto649/models/**'
      - 'src/lotto649/official_history.py'
      - 'src/lotto649/operational_history.py'
      - 'src/lotto649/verified_history.py'
      - 'config.yaml'
      - '.github/workflows/integration.yml'

jobs:
  source-and-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read incident execution guards
        id: execution_guard
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          disabled_sha256 = "ad3237bc57c85013e85dad16d1b6f04f43b50991d666a4b1528bf5b8614a76b6"
          values = {
              "refresh": False,
              "backtest": False,
              "live": False,
              "cycle": False,
          }
          with open(
              os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
          ) as output:
              for name, enabled in values.items():
                  output.write(
                      f"{name}={'true' if enabled else 'false'}\n"
                  )
          try:
              observed_sha256 = hashlib.sha256(
                  Path("config.yaml").read_bytes()
              ).hexdigest()
          except OSError:
              print(
                  "::warning::config.yaml is unavailable; "
                  "execution remains sealed"
              )
          else:
              if observed_sha256 == disabled_sha256:
                  print("Verified incident-disabled config; execution remains sealed")
              else:
                  print(
                      "::warning::Unapproved config SHA-256; "
                      "execution remains sealed"
                  )
          PY
      - uses: actions/setup-python@v5
        if: >-
          steps.execution_guard.outputs.refresh == 'true' ||
          steps.execution_guard.outputs.backtest == 'true' ||
          steps.execution_guard.outputs.cycle == 'true'
        with:
          python-version: '3.12'
      - if: >-
          steps.execution_guard.outputs.refresh == 'true' ||
          steps.execution_guard.outputs.backtest == 'true' ||
          steps.execution_guard.outputs.cycle == 'true'
        run: python -m pip install --upgrade pip
      - if: >-
          steps.execution_guard.outputs.refresh == 'true' ||
          steps.execution_guard.outputs.backtest == 'true' ||
          steps.execution_guard.outputs.cycle == 'true'
        run: pip install -e .
      - name: Append and validate verified history
        if: steps.execution_guard.outputs.refresh == 'true'
        run: lotto649 bootstrap
      - name: Verify operational history
        if: steps.execution_guard.outputs.refresh == 'true'
        run: |
          python - <<'PY'
          from lotto649.config import load_config
          from lotto649.operational_history import load_operational_history

          history = load_operational_history(load_config())
          assert len(history.draws) > 4000, len(history.draws)
          print(history.draws[-5:])
          PY
      - name: Walk-forward model smoke test
        if: steps.execution_guard.outputs.backtest == 'true'
        run: lotto649 backtest --start 2025-01-01 --end 2025-01-08
      - name: Generate live next-draw snapshots without email credentials
        if: steps.execution_guard.outputs.cycle == 'true'
        run: lotto649 live
      - name: Verify snapshots exist
        if: steps.execution_guard.outputs.cycle == 'true'
        run: test "$(find predictions -name '*.json' | wc -l)" -ge 6
