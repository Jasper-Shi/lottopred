      - ambiguous_absence
      - transport_or_auth_failure
  attempt_limit: 1
  caller_bypass: prohibited
  grant:
    post_create_fresh_reread: required
    required_observation: literal_ref_targets_exact_L
    sole_grant: successful_single_createRef_and_exact_reread
