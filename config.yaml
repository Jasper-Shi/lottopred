project:
  timezone: America/Toronto
  model_version: v1.0.0
  seed: 649

data:
  history_url: "https://www.wclc.com/display-on/display-on-downloads/lotto-649-since-inception.htm?channel=print"
  recent_url: "https://www.wclc.com/winning-numbers/lotto-649-extra.htm?channel=print"
  bridge_year_url: "https://www.lotto.net/canada-lotto-6-49/numbers/{year}"
  bridge_start_year: 2024
  processed_csv: "data/processed/draws.csv"

backtest:
  min_history_draws: 300
  test_start: "2020-01-01"
  test_end: "2025-12-31"
  top_k: [6, 12, 18]
  # Consumed-safe regression only. V3/V4 historical scores are preserved in
  # committed reports and must not be recomputed for the new V3 cohort.
  models: [random, ema_gap, v2_statistical]

live:
  models: [random, long_frequency, recent_frequency, ema_gap, logistic, ensemble, v3_boosting]
  shadow_models: [v3_boosting]
  # The V3 v3.0.0 identity is dormant until its registry cohort is explicitly
  # activated by a later reviewed release. While it remains registered and
  # not_activated, live.py continues to emit the legacy v1.0.0 V3 snapshot.
  model_versions:
    v3_boosting: v3.0.0
  model_version_experiments:
    v3_boosting: V3_frozen_shadow_cohort

features:
  recent_windows: [10, 25, 50, 100, 250]
  ema_half_life: 35
  logistic_training_draws: 480
  min_logistic_samples: 300
  v3_training_draws: 280
  v3_stride: 14
  v3_min_history: 300

prediction:
  candidate_pool_size: 12
  final_size: 6

notifications:
  enabled: true
  min_final_hits: 4
  min_top12_hits: 5
  performance_alert_min_draws: 100
  performance_alert_z: 2.58
